name: Validate practice agent

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/real-scan-chat-email, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install production dependency
        run: npm install --ignore-scripts --no-fund
      - name: Validate JavaScript syntax
        run: npm run check
      - name: Run static launch checks
        run: npm test
      - name: Audit production dependency
        run: npm audit --omit=dev --audit-level=high
