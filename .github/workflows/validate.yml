name: Validate practice agent

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/real-scan-chat-email]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate server JavaScript
        run: npm run check
